<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Notas</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <div id="bar">
        <select id="list" aria-label="Notas"></select>
        <button id="new" type="button">Nueva</button>
        <button id="toggle" type="button">Vista</button>
        <button id="delete" type="button">Borrar</button>
      </div>
      <textarea id="editor" aria-label="Contenido de la nota" spellcheck="false"></textarea>
      <div id="preview" hidden></div>
      <div id="status"></div>
    </div>
    <script src="__wm/sdk.js"></script>
    <script src="app.js"></script>
  </body>
</html>
