<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Apps</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <div id="tabs" role="tablist">
        <button id="tab-open" role="tab" type="button">Abiertas</button>
        <button id="tab-pinned" role="tab" type="button">Fijadas</button>
      </div>
      <div id="items"></div>
      <form id="add" hidden>
        <input id="path" placeholder="C:\ruta\programa.exe" aria-label="Ruta del programa" />
        <button type="submit">Fijar</button>
      </form>
      <div id="status"></div>
    </div>
    <script src="__wm/sdk.js"></script>
    <script src="app.js"></script>
  </body>
</html>
