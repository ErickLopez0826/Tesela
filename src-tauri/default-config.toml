# 8.6 Ventana
[[keybinding]]
action = "toggle_stack"
keys = ["alt+v"]
[[keybinding]]
action = "toggle_floating"
keys = ["alt+t"]
[[keybinding]]
action = "toggle_fullscreen"
keys = ["alt+f"]
[[keybinding]]
action = "toggle_minimize"
keys = ["alt+m"]
[[keybinding]]
action = "toggle_floating_centered"
keys = ["alt+shift+space"]
[[keybinding]]
action = "close_window"
keys = ["alt+shift+q"]
[[keybinding]]
action = "cycle_focus"
keys = ["alt+space"]

# Panel desplegable (§9.2): el plan dice "con un clic o un atajo" sin fijar la tecla.
# alt+b es un valor por defecto pendiente de revisión (DECISIONS.md D-33).
[[keybinding]]
action = "toggle_panel"
keys = ["alt+b"]

# Buscador de aplicaciones (§18): abre y cierra la ventana de búsqueda. Sigue activo con el gestor en pausa.
# Si otro programa ya usa esta combinación, cámbiala aquí y recarga con alt+shift+r.
# Para desactivarlo, deja la lista vacía: keys = []
[[keybinding]]
action = "toggle_search"
keys = ["ctrl+shift+space"]

# 8.7 Sistema
[[keybinding]]
action = "open_terminal"
keys = ["alt+enter"]
[[keybinding]]
action = "toggle_pause"
keys = ["alt+shift+p"]
[[keybinding]]
action = "reload_config"
keys = ["alt+shift+r"]
[[keybinding]]
action = "redraw"
keys = ["alt+shift+w"]
[[keybinding]]
action = "exit"
keys = ["alt+shift+e"]
