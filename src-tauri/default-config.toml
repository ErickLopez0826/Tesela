# Configuración de Tesela.
# Se lee al arrancar y al recargar con alt+shift+r. Si tiene errores, se conserva la anterior.
# Los atajos son los del config.yaml de GlazeWM (sección 8 del plan), sin cambios.

[layout]
min_column_width = 200
min_window_height = 120
inner_gap = 20
outer_top = 20        # la barra reserva su propio espacio (AppBar); esto es solo el margen
outer_right = 20
outer_bottom = 20
outer_left = 20
horizontal_axis = "columns"
vertical_axis = "rows"   # monitores verticales: "rows" por defecto (DECISIONS.md)
float_width = 0.6
float_height = 0.7

# Módulos de sistema y de acción (panel desplegable).
[system]
# true: apagar, suspender, reiniciar, hibernar y cambiar Wi-Fi, Bluetooth o compartir red actúan de
# verdad desde el panel (la energía siempre pide confirmación). Ponlo en false para que solo se
# SIMULEN (el panel los muestra pero no tocan el equipo) y reinicia la app.
allow_changes = true
# true: al cambiar de fondo con Wallpaper Engine se dibuja una transición (un círculo que se abre desde el
# cursor, detrás de tus ventanas). false: el cambio es directo. Requiere reiniciar la app.
wallpaper_transition = true
# true: al cambiar de workspace las ventanas del actual suben mientras bajan las del nuevo. false: el cambio es directo.
workspace_transition = true

# Workspaces ligados a monitores (0 = el de más a la izquierda).
[[workspace]]
name = "1"
monitor = 0
[[workspace]]
name = "2"
monitor = 0
[[workspace]]
name = "3"
monitor = 0
[[workspace]]
name = "4"
monitor = 0
[[workspace]]
name = "5"
monitor = 1
[[workspace]]
name = "6"
monitor = 1
[[workspace]]
name = "7"
monitor = 1
[[workspace]]
name = "8"
[[workspace]]
name = "9"

# Reglas de ventana (§16, migradas del config.yaml de GlazeWM): mandar a un workspace y/o flotar centrada.
# Una ventana puede cumplir varias reglas: el primer workspace indicado gana y basta una regla `float`.
# `exe` se compara sin mayúsculas ni ".exe"; `title_contains` ignora mayúsculas.
[[window_rule]]
title_contains = "dashboard"
workspace = 1
[[window_rule]]
exe = "steam"
workspace = 2
[[window_rule]]
exe = "steamwebhelper"
workspace = 2
[[window_rule]]
exe = "EpicGamesLauncher"
workspace = 2
[[window_rule]]
exe = "Antigravity"
workspace = 3
[[window_rule]]
exe = "devenv"
workspace = 3
[[window_rule]]
exe = "Code"
workspace = 3
[[window_rule]]
exe = "Discord"
workspace = 5
[[window_rule]]
exe = "Spotify"
workspace = 5

[[window_rule]]
exe = "Flow.Launcher"
float = true
[[window_rule]]
exe = "javaw"
float = true
[[window_rule]]
exe = "steam"
float = true
[[window_rule]]
exe = "PowerToys.PowerLauncher"
float = true

# 8.1 Foco
[[keybinding]]
action = "focus_left"
keys = ["alt+h", "alt+left"]
[[keybinding]]
action = "focus_right"
keys = ["alt+l", "alt+right"]
[[keybinding]]
action = "focus_up"
keys = ["alt+k", "alt+up"]
[[keybinding]]
action = "focus_down"
keys = ["alt+j", "alt+down"]

# 8.2 Mover ventana
[[keybinding]]
action = "move_left"
keys = ["alt+shift+h", "alt+shift+left"]
[[keybinding]]
action = "move_right"
keys = ["alt+shift+l", "alt+shift+right"]
[[keybinding]]
action = "move_up"
keys = ["alt+shift+k", "alt+shift+up"]
[[keybinding]]
action = "move_down"
keys = ["alt+shift+j", "alt+shift+down"]

# 8.3 Redimensionar
[[keybinding]]
action = "resize_width_-2"
keys = ["alt+u"]
[[keybinding]]
action = "resize_width_+2"
keys = ["alt+p"]
[[keybinding]]
action = "resize_height_+2"
keys = ["alt+o"]
[[keybinding]]
action = "resize_height_-2"
keys = ["alt+i"]

# 8.4 Modo redimensionar
[[keybinding]]
action = "resize_mode"
keys = ["alt+r"]
[[keybinding]]
mode = "resize"
action = "resize_width_-2"
keys = ["h", "left"]
[[keybinding]]
mode = "resize"
action = "resize_width_+2"
keys = ["l", "right"]
[[keybinding]]
mode = "resize"
action = "resize_height_+2"
keys = ["k", "up"]
[[keybinding]]
mode = "resize"
action = "resize_height_-2"
keys = ["j", "down"]
[[keybinding]]
mode = "resize"
action = "exit_resize_mode"
keys = ["escape", "enter"]

