[package]
name = "tesela"
version = "2.0.0"
edition = "2021"

[lib]
name = "tesela_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# El instalador y las compilaciones de producción incrustan la interfaz (`dist`) en vez de pedirla al servidor de desarrollo.
custom-protocol = ["tauri/custom-protocol"]
# Actualizaciones automáticas: necesita clave de firma y un servidor (ver docs/instalacion-y-actualizaciones.md).
updater = ["dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
sysinfo = "0.38.4"
tauri-plugin-updater = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
# Hace falta para la macro `interface` (IPolicyConfig, la interfaz con la que Windows elige la salida de audio).
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_UI_Accessibility",
  "Win32_System_Performance",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Power",
  "Win32_System_WinRT",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
  "Media_Control",
  "Devices_Radios",
  "Devices_WiFi",
  "Devices_Bluetooth",
  "Devices_Enumeration",
  "Security_Credentials",
  "Networking_NetworkOperators",
  "Networking_Connectivity",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls",
  "Win32_Storage_Xps",
  "Win32_Storage_FileSystem",
] }
